<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>광진이음 프로토타입</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* 레이아웃: 폰 폭의 한 칸짜리 앱. 위 머리띠, 가운데 스크롤 영역, 아래 탭. 심부름은 게시판에 붙은 쪽지처럼. */
:root {
  --bg: #e9ecf3;
  --surface: #ffffff;
  --ink: #171c2c;
  --muted: #5d6579;
  --line: #d5d9e4;
  --accent: #2444c9;
  --accent-ink: #ffffff;
  --mark: #ffe45c;
  --mark-ink: #2a2400;
  --wait: #2444c9;
  --run: #b45f00;
  --ok: #17794a;
  --danger: #b3261e;
  --meal: #c2410c;
  --share: #17794a;
  --font-display: 'Do Hyeon', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --font-body: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0d1018; --surface: #181c28; --ink: #eceef5; --muted: #9aa2b6; --line: #2c3243;
    --accent: #8ea2ff; --accent-ink: #0d1018; --mark: #ffe45c; --mark-ink: #2a2400;
    --wait: #8ea2ff; --run: #ffb454; --ok: #5fd39a; --danger: #ff8a80; --meal: #ff9a62; --share: #5fd39a;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0d1018; --surface: #181c28; --ink: #eceef5; --muted: #9aa2b6; --line: #2c3243;
  --accent: #8ea2ff; --accent-ink: #0d1018; --mark: #ffe45c; --mark-ink: #2a2400;
  --wait: #8ea2ff; --run: #ffb454; --ok: #5fd39a; --danger: #ff8a80; --meal: #ff9a62; --share: #5fd39a;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.app { height: 100%; max-width: 430px; margin: 0 auto; display: flex; flex-direction: column; background: var(--bg); position: relative; }
@media (min-width: 480px) { .app { border-inline: 1px solid var(--line); } }

.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; background: var(--accent); color: var(--accent-ink); }
.brand { font-family: var(--font-display); font-size: 22px; letter-spacing: .5px; }
.user { display: flex; align-items: center; gap: 6px; padding: 5px 10px; border: 1.5px solid currentColor; border-radius: 999px; background: transparent; color: inherit; font-size: 13px; }
.user b { font-weight: 600; }
.user small { opacity: .85; font-size: 12px; }

main { flex: 1; overflow-y: auto; padding: 18px 16px 24px; display: flex; flex-direction: column; gap: 14px; min-height: 0; }
h1 { font-family: var(--font-display); font-weight: 400; font-size: 24px; line-height: 1.25; margin: 0; text-wrap: balance; }
.count { color: var(--accent); font-variant-numeric: tabular-nums; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { padding: 6px 14px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface); color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }

.cards { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.card { width: 100%; text-align: left; display: flex; flex-direction: column; gap: 6px; padding: 14px; background: var(--surface); border: 1px solid var(--line); border-left: 5px solid var(--accent); border-radius: 4px 12px 12px 4px; }
.card:hover { border-color: var(--accent); }
.card-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.card-title { font-weight: 600; font-size: 16px; overflow-wrap: anywhere; }
.card-place { color: var(--muted); font-size: 14px; overflow-wrap: anywhere; }
.card-bottom { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 4px; }
.tag { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 4px; border: 1.5px solid var(--ink); }
.status { font-size: 12px; font-weight: 600; }
.status::before { content: ''; display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; background: currentColor; }
.status-open { color: var(--wait); } .status-in_progress { color: var(--run); } .status-done { color: var(--ok); }
.reward { display: inline-block; background: var(--mark); color: var(--mark-ink); font-weight: 700; padding: 1px 8px; border-radius: 3px; font-variant-numeric: tabular-nums; }
.deadline { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.empty { margin: 0; padding: 28px 16px; text-align: center; color: var(--muted); border: 1.5px dashed var(--line); border-radius: 12px; }

form { display: flex; flex-direction: column; gap: 6px; }
label { font-weight: 600; font-size: 14px; margin-top: 8px; }
.opt { font-weight: 400; color: var(--muted); font-size: 12px; }
input, select, textarea { width: 100%; padding: 11px 12px; background: var(--surface); border: 1.5px solid var(--line); border-radius: 8px; }
textarea { resize: vertical; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.row > div { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.form-error { margin: 0; padding: 10px 12px; border-radius: 8px; border: 1.5px solid var(--danger); color: var(--danger); font-weight: 600; }
.hint, .note { margin: 0; color: var(--muted); font-size: 13px; }
.note { padding: 12px; border: 1.5px dashed var(--line); border-radius: 8px; }
.note.done { color: var(--ok); border-color: var(--ok); font-weight: 600; }

.primary { margin-top: 12px; padding: 14px; border: 0; border-radius: 10px; background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 16px; }
.chat-open { padding: 12px; border: 2px solid var(--accent); border-radius: 10px; background: var(--surface); color: var(--accent); font-weight: 700; font-size: 15px; }
.chat-open:hover { background: var(--accent); color: var(--accent-ink); }
.ghost { padding: 12px; border: 1.5px solid var(--line); border-radius: 10px; background: transparent; color: var(--muted); }
.back { align-self: flex-start; padding: 4px 0; border: 0; background: none; color: var(--accent); font-weight: 600; }
.reset { align-self: center; margin-top: 8px; padding: 8px 12px; border: 0; background: none; color: var(--muted); text-decoration: underline; font-size: 13px; }

.detail { display: flex; flex-direction: column; gap: 14px; padding: 18px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.detail h1 { overflow-wrap: anywhere; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
.steps li { padding-top: 8px; border-top: 4px solid var(--line); color: var(--muted); font-size: 13px; }
.steps .past { border-color: var(--ink); color: var(--ink); }
.steps .now { border-color: var(--accent); color: var(--accent); font-weight: 700; }
dl { margin: 0; display: grid; grid-template-columns: 6.5em 1fr; gap: 8px 12px; }
dt { color: var(--muted); font-size: 14px; }
dd { margin: 0; overflow-wrap: anywhere; justify-self: start; }
.detail-text { margin: 0; padding: 12px; background: var(--bg); border-radius: 8px; white-space: pre-wrap; overflow-wrap: anywhere; }

.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; border: 1.5px solid var(--ink); border-radius: 10px; overflow: hidden; }
.seg button { padding: 10px 6px; border: 0; background: var(--surface); color: var(--muted); font-variant-numeric: tabular-nums; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); font-weight: 600; }

.tabs { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
.tabs button { padding: 12px 4px 14px; border: 0; border-top: 3px solid transparent; background: none; color: var(--muted); font-weight: 600; }
.tabs button[aria-current="page"] { color: var(--accent); border-top-color: var(--accent); }

.toast { position: absolute; left: 16px; right: 16px; bottom: 72px; padding: 12px 14px; border-radius: 10px; background: var(--ink); color: var(--bg); text-align: center; font-size: 14px; opacity: 0; transform: translateY(8px); pointer-events: none; transition: opacity .2s, transform .2s; z-index: 10; }
.toast.show { opacity: 1; transform: none; }
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }

/* 서비스별 색 띠, 무료 표시 */
.card.kind-meal { border-left-color: var(--meal); }
.card.kind-share { border-left-color: var(--share); }
.reward.free { background: transparent; color: var(--ink); border: 1.5px solid var(--ink); font-weight: 600; font-size: 13px; }
.foot { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 16px; margin-top: 8px; }
.foot .reset { margin-top: 0; }

/* 로그인 */
.guest .tabs, .guest .actions { display: none; }
.actions { display: flex; align-items: center; gap: 6px; min-width: 0; }
.logout { padding: 6px 10px; border: 1.5px solid currentColor; border-radius: 999px; background: transparent; color: inherit; font-size: 12px; white-space: nowrap; }
.top { flex-wrap: wrap; }
.login { display: flex; flex-direction: column; gap: 16px; padding-top: 12px; }
.eyebrow { margin: 0; align-self: flex-start; background: var(--mark); color: var(--mark-ink); font-weight: 700; font-size: 13px; padding: 2px 10px; border-radius: 3px; }
.login h1 { font-size: 28px; }
.services { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; }
.services li { padding: 4px 12px; border: 1.5px solid var(--ink); border-radius: 4px; font-weight: 600; font-size: 14px; }

main > * { flex-shrink: 0; }
.chk { display: flex; align-items: center; gap: 10px; margin-top: 12px; padding: 12px; border: 1.5px solid var(--line); border-radius: 8px; background: var(--surface); cursor: pointer; }
.chk input { width: 20px; height: 20px; margin: 0; accent-color: var(--accent); }
.now-tag { display: inline-block; font-size: 12px; font-weight: 700; padding: 1px 8px; border-radius: 3px; border: 1.5px solid var(--ok); color: var(--ok); }

/* 1:1 실시간 채팅 */
.in-chat .tabs { display: none; }
.in-chat main { overflow: hidden; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); gap: 10px; }
.chat-head { display: flex; flex-direction: column; gap: 4px; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.chat-head-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.chat-head-title { font-weight: 700; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chat-head-peer { color: var(--muted); font-size: 13px; }
.chat-messages { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding: 4px 2px; }
.chat-empty { margin: auto 0; text-align: center; color: var(--muted); font-size: 14px; padding: 24px 12px; }
.msg { display: flex; flex-direction: column; gap: 3px; max-width: 82%; }
.msg.mine { align-self: flex-end; align-items: flex-end; }
.msg.other { align-self: flex-start; align-items: flex-start; }
.msg-sender { font-size: 12px; color: var(--muted); padding-inline: 4px; }
.msg-row { display: flex; align-items: flex-end; gap: 6px; }
.msg.mine .msg-row { flex-direction: row-reverse; }
.msg-bubble { padding: 9px 13px; border-radius: 14px; font-size: 14px; line-height: 1.45; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.mine .msg-bubble { background: var(--accent); color: var(--accent-ink); border-bottom-right-radius: 4px; }
.msg.other .msg-bubble { background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
.msg-time { font-size: 11px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.chat-form { flex-direction: row; align-items: center; gap: 8px; padding-top: 6px; border-top: 1px solid var(--line); }
.chat-form input { flex: 1; min-width: 0; padding: 11px 12px; }
.chat-send { padding: 11px 16px; border: 0; border-radius: 8px; background: var(--accent); color: var(--accent-ink); font-weight: 700; white-space: nowrap; }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <span class="brand">광진이음</span>
    <div class="actions">
      <span class="user">
        <b id="user-name"></b><small id="user-dept"></small>
      </span>
      <button class="logout" type="button" data-logout>로그아웃</button>
    </div>
  </header>
  <main id="main"></main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <nav class="tabs" aria-label="메뉴">
    <button type="button" data-go="home">홈</button>
    <button type="button" data-go="new">올리기</button>
    <button type="button" data-go="mine">내 활동</button>
  </nav>
</div>

<script>
(function (root) {
  'use strict';

  var KINDS = {
    errand: {
      label: '심부름', reward: true,
      categories: { delivery: '배달', print: '프린트', parcel: '택배', etc: '기타' },
      status: { open: '대기', in_progress: '진행 중', done: '완료' }
    },
    meal: {
      label: '식사동행', reward: false,
      categories: { cafeteria: '학식', restaurant: '맛집', cafe: '카페', etc: '기타' },
      status: { open: '모집 중', in_progress: '약속 잡힘', done: '식사 완료' }
    },
    share: {
      label: '물건 나눔', reward: false,
      categories: { household: '생활용품', book: '책·문구', clothes: '의류', etc: '기타' },
      status: { open: '나눔 중', in_progress: '예약됨', done: '나눔 완료' }
    }
  };

  var SCHOOLS = { sejong: '세종대학교', konkuk: '건국대학교' };

  var SEED = [
    { id: 1, kind: 'errand', title: '학생회관 편의점에서 컵라면이랑 삼각김밥 사다 주세요', category: 'delivery',
      place: '건국대 상허기념도서관 3층 열람실 앞', reward: 2000, deadline: '18:30',
      detail: '신라면 작은 컵 1개, 참치마요 1개요. 물건값은 받을 때 바로 보내드릴게요.',
      requester: 'seed_B', requesterInfo: { name: '이준서', school: '건국대학교' }, status: 'open', runner: null, runnerInfo: null },
    { id: 2, kind: 'errand', title: '전공 과제 20쪽 흑백 양면 출력', category: 'print',
      place: '세종대 학생회관 복사실 → 대양AI센터 407호', reward: 1500, deadline: '13:50',
      detail: '파일은 수락하시면 보내드려요. 2시 수업 전에 받아야 해요.',
      requester: 'seed_C', requesterInfo: { name: '박서연', school: '세종대학교' }, status: 'open', runner: null, runnerInfo: null },
    { id: 3, kind: 'errand', title: '기숙사 택배 보관함에서 상자 하나 찾아 주세요', category: 'parcel',
      place: '건국대 쿨하우스 1층 → 공학관 로비', reward: 2500, deadline: '21:00',
      detail: '신발 상자 크기예요. 보관함 번호는 수락 후 알려드릴게요.',
      requester: 'seed_D', requesterInfo: { name: '최민재', school: '건국대학교' }, status: 'open', runner: null, runnerInfo: null },
    { id: 4, kind: 'meal', title: '학생회관 학식 같이 먹을 분', category: 'cafeteria',
      place: '세종대 학생회관 지하 1층 식당 앞', reward: 0, deadline: '12:10',
      detail: '혼밥이 지겨워서 올려요. 각자 계산하고 30분 정도 먹어요.',
      requester: 'seed_C', requesterInfo: { name: '박서연', school: '세종대학교' }, status: 'open', runner: null, runnerInfo: null },
    { id: 5, kind: 'meal', title: '건대입구 마라탕, 2인 세트 나눠 먹어요', category: 'restaurant',
      place: '건대입구역 2번 출구 앞', reward: 0, deadline: '18:00',
      detail: '2인 세트가 훨씬 싸서요. 맵기는 2단계로 생각 중이에요.',
      requester: 'seed_B', requesterInfo: { name: '이준서', school: '건국대학교' }, status: 'open', runner: null, runnerInfo: null },
    { id: 6, kind: 'share', title: '안 쓰는 전공 서적 3권 나눔해요', category: 'book',
      place: '세종대 생활관 로비', reward: 0, deadline: '20:00',
      detail: '한 학기 사용했고 필기는 거의 없어요. 3권 모두 한 번에 가져가실 분이면 좋아요.',
      requester: 'seed_C', requesterInfo: { name: '박서연', school: '세종대학교' }, status: 'open', runner: null, runnerInfo: null },
    { id: 7, kind: 'share', title: '자취방 정리하면서 남은 수건 4장, 미니 선풍기', category: 'household',
      place: '건국대 후문 앞', reward: 0, deadline: '19:30',
      detail: '수건은 새것에 가깝고 선풍기는 정상 작동해요. 이사 전에 정리하려고 올려요.',
      requester: 'seed_D', requesterInfo: { name: '최민재', school: '건국대학교' }, status: 'open', runner: null, runnerInfo: null }
  ];

  function own(obj, key) { return typeof key === 'string' && Object.prototype.hasOwnProperty.call(obj, key); }
  function text(v) { return String(v == null ? '' : v).trim(); }

  function createState(seed) {
    var posts = (seed || SEED).map(function (e) {
      return Object.assign({ status: 'open', runner: null, runnerInfo: null }, e);
    });
    return { user: null, posts: posts };
  }

  // 기기별 고유 사용자 식별자(학교_학번)를 생성해 서로 다른 기기 간 역할을 구분한다.
  function login(state, input) {
    input = input || {};
    var school = own(SCHOOLS, input.school) ? SCHOOLS[input.school] : null;
    var id = text(input.studentId);
    var pw = String(input.password == null ? '' : input.password);
    if (!school) return { ok: false, error: '소속 대학교를 선택해 주세요.' };
    if (!id) return { ok: false, error: '학번을 입력해 주세요.' };
    if (!/^\d{6,10}$/.test(id)) return { ok: false, error: '학번은 6~10자리 숫자로 입력해 주세요.' };
    if (!pw) return { ok: false, error: '비밀번호를 입력해 주세요.' };
    if (pw.length < 4) return { ok: false, error: '비밀번호는 4자 이상 입력해 주세요.' };
    state.user = {
      id: input.school + '_' + id,
      name: '학번 ' + id.slice(-4),
      school: school
    };
    return { ok: true };
  }

  function logout(state) { state.user = null; }

  function find(state, id) {
    for (var i = 0; i < state.posts.length; i++) {
      if (state.posts[i].id === id) return state.posts[i];
    }
    return null;
  }

  // 매칭이 성사된 두 사람(글 작성자, 수락자)만 채팅 가능
  function canChat(state, post) {
    if (!state.user || !post) return false;
    if (post.status !== 'in_progress' && post.status !== 'done') return false;
    if (!post.runner) return false;
    return post.requester === state.user.id || post.runner === state.user.id;
  }

  var NEED_LOGIN = { ok: false, error: '학교 학번으로 로그인한 뒤에 이용할 수 있어요.' };

  function addPost(state, input) {
    if (!state.user) return NEED_LOGIN;
    input = input || {};
    if (!own(KINDS, input.kind)) return { ok: false, error: '서비스를 골라 주세요.' };
    var kind = KINDS[input.kind];
    var title = text(input.title), place = text(input.place), rewardText = text(input.reward);
    if (!title) return { ok: false, error: '제목을 적어 주세요.' };
    if (!own(kind.categories, input.category)) return { ok: false, error: '종류를 골라 주세요.' };
    if (!place) return { ok: false, error: '장소를 적어 주세요.' };
    if (kind.reward && !/^\d{1,7}$/.test(rewardText)) {
      return { ok: false, error: '수고비는 0원 이상의 숫자로 적어 주세요.' };
    }
    var postId = Date.now() * 100 + Math.floor(Math.random() * 100);
    var post = {
      id: postId,
      kind: input.kind,
      title: title,
      category: input.category,
      place: place,
      reward: kind.reward ? parseInt(rewardText, 10) : 0,
      deadline: text(input.deadline),
      detail: text(input.detail),
      immediate: !!input.immediate,
      status: 'open',
      requester: state.user.id,
      requesterInfo: { name: state.user.name, school: state.user.school },
      runner: null,
      runnerInfo: null
    };
    state.posts.push(post);
    return { ok: true, post: post };
  }

  function acceptPost(state, id) {
    if (!state.user) return NEED_LOGIN;
    var e = find(state, id);
    if (!e) return { ok: false, error: '글을 찾을 수 없어요.' };
    if (e.requester === state.user.id) return { ok: false, error: '내가 올린 글에는 내가 참여할 수 없어요.' };
    if (e.status !== 'open') return { ok: false, error: '이미 다른 사람이 먼저 참여했어요.' };
    e.status = 'in_progress';
    e.runner = state.user.id;
    e.runnerInfo = { name: state.user.name, school: state.user.school };
    return { ok: true, post: e };
  }

  function completePost(state, id) {
    if (!state.user) return NEED_LOGIN;
    var e = find(state, id);
    if (!e) return { ok: false, error: '글을 찾을 수 없어요.' };
    if (e.requester !== state.user.id) return { ok: false, error: '완료 처리는 글을 올린 사람만 할 수 있어요.' };
    if (e.status !== 'in_progress') return { ok: false, error: '상대가 정해진 글만 완료할 수 있어요.' };
    e.status = 'done';
    return { ok: true, post: e };
  }

  function byNewest(a, b) { return b.id - a.id; }

  function listOpen(state, kind, category) {
    return state.posts.filter(function (e) {
      return e.kind === kind && e.status === 'open' &&
        (!category || category === 'all' || e.category === category);
    }).sort(byNewest);
  }

  function myPosts(state) {
    var uid = state.user ? state.user.id : '';
    return {
      posted: state.posts.filter(function (e) { return e.requester === uid; }).sort(byNewest),
      accepted: state.posts.filter(function (e) { return e.runner === uid; }).sort(byNewest)
    };
  }

  var api = {
    KINDS: KINDS, SCHOOLS: SCHOOLS, SEED: SEED,
    createState: createState, login: login, logout: logout,
    find: find, canChat: canChat, addPost: addPost, acceptPost: acceptPost,
    completePost: completePost, listOpen: listOpen, myPosts: myPosts
  };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else root.Logic = api;
})(typeof window !== 'undefined' ? window : globalThis);
</script>

  function stopChatSubscription() {
    if (unsubscribeChat) {
      unsubscribeChat();
      unsubscribeChat = null;
    }
    chatMessages = [];
  }

      '<div class="chat-head-peer">대화 상대: ' + who(peerInfo) + '</div>' +
      '</div>' +
      '<div class="chat-messages" id="chat-messages">' + renderChatMessagesHtml(chatMessages) + '</div>' +
      '<form class="chat-form" id="chat-form" autocomplete="off">' +
      '<input id="chat-input" name="message" maxlength="300" placeholder="메시지를 입력하세요" aria-label="메시지 입력">' +
      '<button class="chat-send" type="submit">전송</button>' +
      '</form>';
  }

  function openChat(postId) {
    var e = L.find(state, postId);
    if (!L.canChat(state, e)) {
      toast('매칭된 두 사람만 1:1 채팅을 할 수 있어요.');
      return;
    }
    stopChatSubscription();
    view.name = 'chat';
    view.id = postId;
    view.error = '';
    render();
    if (root.cloudDB && root.cloudDB.subscribeChat) {
      unsubscribeChat = root.cloudDB.subscribeChat(postId, function (messages) {
        chatMessages = messages;
        if (view.name === 'chat' && view.id === postId) {
          updateChatListUI();
        }
      });
    }
  }

  function renderMine() {
    var m = L.myPosts(state);
    var list = view.mineTab === 'posted' ? m.posted : m.accepted;
    return '<h1>내 활동</h1>' +
      seg('mine', [['posted', '내가 올린 것 ' + m.posted.length], ['accepted', '내가 참여한 것 ' + m.accepted.length]], view.mineTab, '내 활동 구분') +
      (list.length ? '<ul class="cards">' + list.map(function (e) { return card(e, true); }).join('') + '</ul>'
        : empty(view.mineTab === 'posted' ? '아직 올린 글이 없어요.' : '아직 참여한 글이 없어요.')) +
      '<div class="foot"><button class="reset" type="button" data-reset>예시 데이터로 초기화</button>' +
      '<button class="reset" type="button" data-logout>로그아웃</button></div>';
  }

  function render() {
    var guest = !state.user;
    var appEl = document.querySelector('.app');
    appEl.classList.toggle('guest', guest);
    appEl.classList.toggle('in-chat', !guest && view.name === 'chat');
    if (guest) { $('main').innerHTML = renderLogin(); return; }
    $('user-name').textContent = state.user.name;
    $('user-dept').textContent = state.user.school;
    var html = view.name === 'new' ? renderNew()
      : view.name === 'detail' ? renderDetail()
      : view.name === 'chat' ? renderChat()
      : view.name === 'mine' ? renderMine()
      : renderHome();
    $('main').innerHTML = html;
    if (view.name === 'chat') {
      var box = $('chat-messages');
      if (box) box.scrollTop = box.scrollHeight;
    }
    var tab = (view.name === 'detail' || view.name === 'chat') ? view.back : view.name;
    Array.prototype.forEach.call(document.querySelectorAll('.tabs button'), function (b) {
      if (b.dataset.go === tab) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
    });
  }

  function readDraft() {
    var f = $('new-form');
    if (f) {
      view.draft = {
        title: f.title.value, category: f.category.value, place: f.place.value,
        reward: f.reward ? f.reward.value : (view.draft ? view.draft.reward : ''),
        deadline: f.deadline.value, detail: f.detail.value,
        immediate: f.immediate ? f.immediate.checked : false
      };
    }
    var lf = $('login-form');
    if (lf) view.loginDraft = { school: lf.school.value, studentId: lf.studentId.value, password: lf.password.value };
  }

  // Firebase 실시간 게시글 수신 시 호출되는 콜백
  root.onRemotePostsUpdate = function (remoteList) {
    state.posts = remoteList;
    if (!state.user) return;
    // 글 작성 중이거나 채팅 입력 중에는 입력창 초기화를 막기 위해 전체 리렌더를 피한다.
    if (view.name === 'chat') {
      var cur = L.find(state, view.id);
      var statusEl = $('chat-status');
      if (cur && statusEl) {
        statusEl.className = 'status status-' + cur.status;
        statusEl.textContent = L.KINDS[cur.kind].status[cur.status];
      }
      return;
    }
    if (view.name !== 'new') {
      render();
    }
  };

  root.getSeedPosts = function () {
    return L.SEED.map(function (e) { return Object.assign({}, e); });
  };

  document.addEventListener('click', function (ev) {
    var t = ev.target.closest('button');
    if (!t) return;
    var d = t.dataset;
    readDraft();
    if (d.go) return go(d.go);
    if (d.open) {
      var backTarget = view.name === 'chat' ? view.back : (view.name === 'mine' ? 'mine' : 'home');
      return go('detail', { id: Number(d.open), back: backTarget });
    }
    if (d.chat) return openChat(Number(d.chat));
    if (d.kind) { view.kind = d.kind; view.category = 'all'; view.error = ''; return render(); }
    if (d.cat) { view.category = d.cat; return render(); }
    if (d.mine) { view.mineTab = d.mine; return render(); }
    if (d.accept || d.complete) {
      var targetId = Number(d.accept || d.complete);
      var post = L.find(state, targetId);
      var r = d.accept ? L.acceptPost(state, targetId) : L.completePost(state, targetId);
      if (r.ok && root.cloudDB) {
        root.cloudDB.updateStatus(targetId, {
          status: r.post.status,
          runner: r.post.runner,
          runnerInfo: r.post.runnerInfo
        });
      }
      toast(r.ok ? T[post.kind][d.accept ? 'accepted' : 'completed'] : r.error);
      return render();
    }
    if ('reset' in d) {
      stopChatSubscription();
      var seeds = root.getSeedPosts();
      state.posts = seeds;
      if (root.cloudDB) root.cloudDB.resetAll(seeds);
      view.draft = null;
      render();
      return toast('예시 데이터로 초기화했어요.');
    }
    if ('logout' in d) {
      stopChatSubscription();
      L.logout(state);
      saveUser();
      view.loginDraft = { school: '', studentId: '', password: '' };
      return go('home', { kind: 'errand', category: 'all' });
    }
  });

  document.addEventListener('submit', function (ev) {
    ev.preventDefault();
    if (ev.target.id === 'chat-form') {
      var inputEl = $('chat-input');
      var msgText = inputEl ? inputEl.value.trim() : '';
      if (!msgText) return;
      var post = L.find(state, view.id);
      if (!L.canChat(state, post)) {
        toast('매칭된 두 사람만 메시지를 보낼 수 있어요.');
        return;
      }
      var msg = {
        senderId: state.user.id,
        senderName: state.user.name,
        senderSchool: state.user.school,
        text: msgText,
        createdAt: Date.now()
      };
      inputEl.value = '';
      inputEl.focus();
      if (root.cloudDB && root.cloudDB.sendChatMessage) {
        root.cloudDB.sendChatMessage(post.id, msg);
      } else {
        chatMessages.push(msg);
        updateChatListUI();
      }
      return;
    }

    readDraft();
    if (ev.target.id === 'login-form') {
      var lr = L.login(state, view.loginDraft);
      if (!lr.ok) { view.error = lr.error; return render(); }
      saveUser();
      view.loginDraft = { school: '', studentId: '', password: '' };
      go('home');
      return toast(state.user.school + ' 학생으로 로그인했어요.');
    }
    if (ev.target.id !== 'new-form') return;
    var r = L.addPost(state, Object.assign({ kind: view.kind }, view.draft));
    if (!r.ok) { view.error = r.error; render(); $('main').scrollTop = 0; return; }
    if (root.cloudDB) root.cloudDB.savePost(r.post);
    view.draft = null;
    view.category = 'all';
    go('detail', { id: r.post.id, back: 'mine', mineTab: 'posted' });
    toast('글을 올렸어요.');
  });

  render();
})(typeof window !== 'undefined' ? window : globalThis);
</script>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, onValue, set, update, push } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCiv5YBwR1_sFddoP7oyDhxM711odVAh6g",
    authDomain: "gj-em-66501.firebaseapp.com",
    databaseURL: "https://gj-em-66501-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "gj-em-66501",
    storageBucket: "gj-em-66501.firebasestorage.app",
    messagingSenderId: "646603842391",
    appId: "1:646603842391:web:9febeb33485450a1f35412",
    measurementId: "G-HZDQTFYFSF"
  };

  if (firebaseConfig.apiKey !== "여기에_API_KEY") {
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const postsRef = ref(db, 'posts');
    let initialized = false;

    // 1) 게시글 실시간 수신
    onValue(postsRef, (snapshot) => {
      const data = snapshot.val();
      if (!data) {
        if (!initialized && window.getSeedPosts) {
          initialized = true;
          const seedMap = {};
          window.getSeedPosts().forEach((p) => { seedMap[p.id] = p; });
          set(postsRef, seedMap);
          return;
        }
        window.onRemotePostsUpdate([]);
        return;
      }
      initialized = true;
      window.onRemotePostsUpdate(Object.values(data));
    });

    // 2) 게시글 저장·상태 변경·1:1 실시간 채팅 API
    window.cloudDB = {
      savePost: (post) => set(ref(db, 'posts/' + post.id), post),
      updateStatus: (id, patch) => update(ref(db, 'posts/' + id), patch),
      resetAll: (seeds) => {
        const seedMap = {};
        seeds.forEach((p) => { seedMap[p.id] = p; });
        return Promise.all([set(postsRef, seedMap), set(ref(db, 'chats'), null)]);
      },
      subscribeChat: (postId, callback) => {
        const chatRef = ref(db, 'chats/' + postId);
        return onValue(chatRef, (snapshot) => {
          const data = snapshot.val();
          const list = data ? Object.values(data).sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0)) : [];
          callback(list);
        });
      },
      sendChatMessage: (postId, msg) => push(ref(db, 'chats/' + postId), msg)
    };
  }
</script>
